{{ define "main" }}
<h1 class="text-2xl font-semibold mb-2">Publications</h1>
<p class="text-sm text-neutral-500 mb-8">Research papers and conference publications.</p>
<hr class="border-neutral-200 mb-8">

{{ $pages := where .Pages ".Params.draft" "!=" true }}
{{ range $index, $page := $pages }}
  {{ partial "publication-item.html" $page }}
  {{ if ne $index (sub (len $pages) 1) }}
    <hr class="border-neutral-100 my-6">
  {{ end }}
{{ end }}
{{ end }}
